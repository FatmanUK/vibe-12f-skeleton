name: Deploy

on:
  push:
    branches:
      - mother

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.24'

    - name: Install dependencies
      run: go mod download

    - name: Lint Go code
      run: make lint

    - name: Run unit tests
      run: make test

    - name: Build Podman image
      run: podman build -t ghcr.io/FatmanUK/vibe-12f-skeleton:${{ github.sha }} .

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Podman image to GHCR
      run: podman push ghcr.io/FatmanUK/vibe-12f-skeleton:${{ github.sha }}
